services:
  - type: web
    name: redbus-booking-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HOLD_GRACE_PERIOD_SECONDS
        value: 900
